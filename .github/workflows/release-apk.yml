name: Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.0)'
        required: true
        type: string
        default: 'v2.0.0'
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'VYBE Release'
      release_notes:
        description: 'Release Notes (user visible)'
        required: false
        type: string
        default: 'Official stable production release.'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using base64 keystore placeholder for CI build..."
            base64 --decode debug.keystore.base64 > my-upload-key.jks || true
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating build keystore for signing release artifact..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=VYBE Release,O=Vyoma,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK (R8 Minified)
        run: gradle assembleRelease

      - name: Verify Release APK Output
        run: |
          ls -la app/build/outputs/apk/release/
          # Ensure a release APK was produced, never a debug APK for production
          find app/build/outputs/apk/release/ -name "*.apk" | grep -q "release" || {
            echo "Error: Production release APK was not found!"
            exit 1
          }

      - name: Archive Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybe-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_title || github.ref_name }}
          body: ${{ inputs.release_notes || 'Official production release of VYBE Music Player.' }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
