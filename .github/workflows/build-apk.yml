name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  GRADLE_VERSION: 9.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle zip ko cache karte hain taaki 504 aaye to bhi cache se chale
      - name: Cache Gradle distribution
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ env.GRADLE_VERSION }}

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -e
          mkdir -p "$HOME/gradle-dist"
          ZIP="$HOME/gradle-dist/gradle-${GRADLE_VERSION}-bin.zip"
          if [ ! -s "$ZIP" ]; then
            ok=0
            for attempt in 1 2 3 4 5 6; do
              for base in \
                "https://services.gradle.org/distributions" \
                "https://downloads.gradle.org/distributions" \
                "https://github.com/gradle/gradle-distributions/releases/download/v${GRADLE_VERSION}"; do
                echo "Attempt $attempt: $base"
                if curl -fSL --retry 3 --retry-delay 5 --retry-all-errors \
                     --connect-timeout 30 --max-time 300 \
                     -o "$ZIP" "$base/gradle-${GRADLE_VERSION}-bin.zip"; then
                  ok=1; break 2
                fi
                rm -f "$ZIP"
              done
              echo "All mirrors failed, waiting 20s..."
              sleep 20
            done
            [ "$ok" = "1" ] || { echo "Gradle download failed"; exit 1; }
          fi
          unzip -q -o "$ZIP" -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VYBE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE
          path: VYBE.apk
          if-no-files-found: error
