name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  GRADLE_VERSION: 9.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle zip ko cache karte hain taaki 504 aaye to bhi cache se chale
      - name: Cache Gradle distribution
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ env.GRADLE_VERSION }}

      - name: Network check (debug)
        continue-on-error: true
        run: |
          for u in https://services.gradle.org https://github.com https://repo.maven.apache.org https://mirrors.cloud.tencent.com/gradle/ https://repo.huaweicloud.com/gradle/; do
            echo -n "$u -> "
            curl -s -o /dev/null -m 15 -w "%{http_code}\n" -I "$u" || echo "fail"
          done

      - name: Install Gradle ${{ env.GRADLE_VERSION }} (mirrors)
        id: manual
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$HOME/gradle-dist"
          ZIP="$HOME/gradle-dist/gradle-${GRADLE_VERSION}-bin.zip"
          if [ ! -s "$ZIP" ]; then
            ok=0
            for attempt in 1 2 3; do
              for url in \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-bin.zip" \
                "https://repo.huaweicloud.com/gradle/gradle-${GRADLE_VERSION}-bin.zip" \
                "https://mirrors.aliyun.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"; do
                echo "Attempt $attempt: $url"
                if curl -fSL --retry 2 --retry-delay 3 --retry-all-errors \
                     --connect-timeout 20 --max-time 240 -o "$ZIP" "$url" \
                   && unzip -tq "$ZIP" >/dev/null 2>&1; then
                  ok=1; break 2
                fi
                rm -f "$ZIP"
              done
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "Mirror download failed"; exit 1; }
          fi
          unzip -q -o "$ZIP" -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Fallback: agar mirrors fail ho jaye to official action use karo
      - name: Install Gradle (action fallback)
        if: steps.manual.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle
        run: gradle --version

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleDebug --no-daemon --console=plain --stacktrace \
                 --no-configuration-cache --no-build-cache \
                 -Dorg.gradle.internal.http.connectionTimeout=60000 \
                 -Dorg.gradle.internal.http.socketTimeout=120000 \
                 -Dorg.gradle.internal.repository.max.retries=10 \
                 2>&1 | tee build.log; then
              ok=1; break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            {
              echo "## Build failed - error summary"
              echo '```'
              grep -nE -A6 "What went wrong|^e: |error:|Could not (resolve|download|GET)" build.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=== ERROR SUMMARY ==="
            grep -nE -A6 "What went wrong|^e: |error:|Could not (resolve|download|GET)" build.log | head -60
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VYBE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE
          path: VYBE.apk
          if-no-files-found: error
