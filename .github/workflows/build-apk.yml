
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Download Gradle directly with retries
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"
          GRADLE_ZIP="$RUNNER_TEMP/gradle.zip"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 900 \
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # 4. Verify Gradle
      - name: Verify Gradle
        run: gradle --version

      # 5. Generate Debug Keystore
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 7. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          ls -lh "$APK"

      # 8. Rename APK
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VYBE.apk

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE
          path: VYBE.apk
          if-no-files-found: error
          retention-days: 30
          
